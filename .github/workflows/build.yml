name: Build

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test:
    # Pin the image. ubuntu-latest moves to Ubuntu 26, and the Linux
    # package below stays on 22.04 for the SteamOS glibc.
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt libraries for the offscreen window
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxcb-cursor0 \
            libfontconfig1 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxi6
      - name: Install the window extra and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]"
          python -m unittest discover -s tests -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not ubuntu-latest: SteamOS still has that glibc.
          - os: ubuntu-22.04
            artifact: D2RSaveSync-linux
            binary: dist/D2RSaveSync
          - os: windows-latest
            artifact: D2RSaveSync-windows
            binary: dist/D2RSaveSync.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Qt libraries for the Linux build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libxcb-cursor0 \
            libfontconfig1 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxi6
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pyinstaller
      - name: Build the single executable
        run: pyinstaller --noconfirm --clean D2RSaveSync.spec
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
