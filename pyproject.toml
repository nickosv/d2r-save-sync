[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d2r-save-sync"
version = "0.2.4"
description = "Sync Diablo II: Resurrected offline saves between a Windows PC and a Steam Deck over the LAN"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]

# No console_scripts. pip would write unsigned .exe launchers next to Python,
# and Windows Smart App Control can block those. Start the window with
# pythonw.exe -m d2rsync. The shortcut command is `py -m d2rsync --create-shortcuts`.

[tool.setuptools.packages.find]
include = ["d2rsync*"]

[tool.setuptools.package-data]
d2rsync = ["assets/*.ico"]
